# Web UI + MySQL. Every job is saved as CSV in ./gmapsdata and in the
# `places` table of the `gmaps` database.
#
#   docker compose -f docker-compose.mysql.yaml up -d --watch
#
# --watch keeps this file's develop.watch running. A code change rebuilds
# gmaps-local and recreates the scraper. gmapsdata and MySQL are left as they are.
# The first build after a Dockerfile change is slow. Later code changes reuse
# the Playwright layer and only recompile the Go binary.
#
# Web UI: http://localhost:8081
# MySQL:  127.0.0.1:3307 (3306 is often taken by other stacks), database gmaps, user gmaps, password gmaps
# Mailpit inbox: http://127.0.0.1:8026
#   Campaign SMTP from the scraper container: host mailpit, port 1025, encryption none.
#   Username and password can stay empty. Mailpit also accepts any login.
#
# Change the passwords below before exposing this anywhere but your machine.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gmaps
      MYSQL_USER: gmaps
      MYSQL_PASSWORD: gmaps
      MYSQL_ROOT_PASSWORD: gmaps-root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugmaps", "-pgmaps"]
      interval: 5s
      timeout: 5s
      retries: 30

  scraper:
    build: .
    image: gmaps-local
    restart: unless-stopped
    # Runs an init (tini) as PID 1. Browsers left behind by a killed Playwright
    # driver are re-parented to PID 1; without an init nothing reaps them and
    # they pile up as zombies.
    init: true
    # Several jobs run in parallel, each with its own headless Chromium. Chromium
    # keeps page memory in /dev/shm; Docker's 64MB default makes tabs crash.
    shm_size: "2gb"
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - gmapsdata/
            - .git/
            - docker-compose.mysql.yaml
            - tmp_e2e/
            - "**/*_test.go"
            - "**/*.md"
            - .claude/
            - .mcp.json
            - .env
    depends_on:
      mysql:
        condition: service_healthy
    # MYSQL_BANCO_NAO_PERTURBE_* and UNSUBSCRIBE_BASE_URL come from .env (see .env.example).
    # Without the unsubscribe database every email send is refused.
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_DSN: "gmaps:gmaps@tcp(mysql:3306)/gmaps?parseTime=true&charset=utf8mb4"
    command: ["-data-folder", "/gmapsdata"]
    ports:
      - "8081:8081"
    volumes:
      - ./gmapsdata:/gmapsdata

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit-data:/data

volumes:
  mysql-data:
  mailpit-data:
