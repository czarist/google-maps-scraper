# Web UI + MySQL. Every job is saved as CSV in ./gmapsdata and in the
# `places` table of the `gmaps` database.
#
#   docker compose -f docker-compose.mysql.yaml up -d --watch
#
# --watch keeps this file's develop.watch running. A code change rebuilds
# gmaps-local and recreates the scraper. gmapsdata and MySQL are left as they are.
# The first build after a Dockerfile change is slow. Later code changes reuse
# the Playwright layer and only recompile the Go binary.
#
# Web UI: http://localhost:8080
# MySQL:  127.0.0.1:3306, database gmaps, user gmaps, password gmaps
# Mailpit inbox: http://127.0.0.1:8025
#   Campaign SMTP from the scraper container: host mailpit, port 1025, encryption none.
#   Username and password can stay empty. Mailpit also accepts any login.
#
# Change the passwords below before exposing this anywhere but your machine.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gmaps
      MYSQL_USER: gmaps
      MYSQL_PASSWORD: gmaps
      MYSQL_ROOT_PASSWORD: gmaps-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugmaps", "-pgmaps"]
      interval: 5s
      timeout: 5s
      retries: 30

  scraper:
    build: .
    image: gmaps-local
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - gmapsdata/
            - .git/
            - docker-compose.mysql.yaml
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DSN: "gmaps:gmaps@tcp(mysql:3306)/gmaps?parseTime=true&charset=utf8mb4"
    command: ["-data-folder", "/gmapsdata"]
    ports:
      - "8080:8080"
    volumes:
      - ./gmapsdata:/gmapsdata

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit-data:/data

volumes:
  mysql-data:
  mailpit-data:
